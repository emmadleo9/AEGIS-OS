# Krynara-OS — Monorepo Docker Compose
# WhatsApp -> OpenWA (gateway:2785) -> Webhook -> OpenJarvis (core:8000) -> LLM -> OpenWA SDK reply -> Console
#
# Hardware target: i7-7500U, 16GB RAM, 2GB GPU -> tiny models (qwen2.5:3b), SQLite for OpenWA
#
# Run: docker compose up -d

services:
  # ===== CORE: OpenJarvis =====
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: krynara-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      - MODEL=qwen2.5:3b
      - OPENJARVIS_MODEL=qwen2.5:3b
      - OLLAMA_HOST=http://ollama:11434
      - WHATSAPP_VERIFY_TOKEN=krynara_verify_token
      - WHATSAPP_APP_SECRET=krynara_app_secret
      - KRYNARA_GATEWAY_URL=http://gateway:2785
      - KRYNARA_API_KEY=krynara_master_key
      - KRYNARA_SESSION_ID=krynara-whatsapp-session
      - OPENJARVIS_CORS_ORIGINS=http://console:3000,http://localhost:3000
      - LOG_LEVEL=info
    volumes:
      - ./data/core:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - krynara

  # ===== GATEWAY: OpenWA =====
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: krynara-gateway
    restart: unless-stopped
    stop_grace_period: 75s
    ports:
      - "127.0.0.1:2785:2785"
    expose:
      - "2785"
    environment:
      - NODE_ENV=production
      - PORT=2785
      - LOG_LEVEL=info
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=false
      - ENGINE_TYPE=whatsapp-web.js
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      - WEBHOOK_URL=http://core:8000/webhooks/whatsapp
      - SSRF_ALLOWED_HOSTS=core
      - API_MASTER_KEY=krynara_master_key
      - CORS_ORIGINS=http://console:3000,http://localhost:3000
      - OPENWA_MEM_LIMIT=2g
      - OPENWA_PIDS_LIMIT=2048
      - MCP_ENABLED=true
      - SERVE_DASHBOARD=true
    volumes:
      - ./data/gateway:/app/data
    mem_limit: 2g
    pids_limit: 2048
    depends_on:
      - core
    networks:
      - krynara

  # ===== CONSOLE: KRYNARA (rebranded open-bsp-ui) =====
  console:
    build:
      context: ./console
      dockerfile: Dockerfile
    container_name: krynara-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    environment:
      - VITE_GATEWAY_URL=http://gateway:2785
      - VITE_BRAIN_URL=http://core:8000
      - VITE_APP_NAME=KRYNARA
      - NODE_ENV=production
    depends_on:
      - gateway
      - core
    networks:
      - krynara

  # ===== OLLAMA: Local LLM (qwen2.5:3b) =====
  ollama:
    image: ollama/ollama:latest
    container_name: krynara-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - krynara
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===== DB: Postgres 15 for OpenBSP triggers =====
  db:
    image: postgres:15-alpine
    container_name: krynara-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=krynara
      - POSTGRES_PASSWORD=krynara_password
      - POSTGRES_DB=krynara_console
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - krynara

  # ===== Redis (if needed by OpenWA / rate limits) =====
  redis:
    image: redis:7-alpine
    container_name: krynara-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - ./data/redis:/data
    networks:
      - krynara

volumes:
  core-data:
  gateway-data:
  console-data:
  db-data:
  redis-data:

networks:
  krynara:
    name: krynara-network
    driver: bridge
