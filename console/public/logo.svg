<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer shield frame -->
  <path d="M100 20 C60 20 30 40 30 70 L30 110 C30 140 60 160 100 180 C140 160 170 140 170 110 L170 70 C170 40 140 20 100 20 Z" 
        fill="none" stroke="url(#shieldGlow)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner shield frame -->
  <path d="M100 44 C82 44 62 56 62 82 L62 118 C62 138 86 154 100 164 C114 154 138 138 138 118 L138 82 C138 56 118 44 100 44 Z" 
        fill="none" stroke="rgba(0,255,136,0.3)" stroke-width="2"/>

  <!-- Network nodes -->
  <circle cx="72" cy="62" r="2" fill="#00ff88" opacity="0.9"/>
  <circle cx="82" cy="70" r="1.5" fill="#00ff88" opacity="0.6"/>
  <circle cx="92" cy="60" r="2" fill="#00ff88" opacity="0.8"/>
  <circle cx="100" cy="75" r="2" fill="#00ff88" opacity="0.9"/>
  <circle cx="108" cy="82" r="1.5" fill="#00ff88" opacity="0.6"/>
  <circle cx="118" cy="70" r="2" fill="#00ff88" opacity="0.7"/>
  <circle cx="128" cy="88" r="1.5" fill="#00ff88" opacity="0.5"/>
  <circle cx="90" cy="110" r="2" fill="#00ff88" opacity="0.8"/>
  <circle cx="100" cy="128" r="1.5" fill="#00ff88" opacity="0.6"/>
  <circle cx="78" cy="100" r="1.5" fill="#00ff88" opacity="0.5"/>

  <!-- Network lines -->
  <line x1="72" y1="62" x2="82" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="82" y1="70" x2="92" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="92" y1="60" x2="100" y2="75" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="75" x2="108" y2="82" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="108" y1="82" x2="118" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="118" y1="70" x2="128" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="128" y1="88" x2="90" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="110" x2="100" y2="128" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="128" x2="78" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="78" y1="100" x2="72" y2="62" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="20" x2="100" y2="110" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
