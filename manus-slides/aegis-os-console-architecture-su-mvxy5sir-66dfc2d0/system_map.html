<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #050A0E; color: #E2F1F8;
      font-family: 'Roboto Mono', monospace;
      display: flex; flex-direction: column;
      padding: 40px;
    }
    .motif { 
      position: absolute; top: 40px; right: 40px;
      color: #8AF8FF; font-family: 'Share Tech Mono', monospace;
      font-size: 14px; letter-spacing: 2px;
    }
    header { margin-bottom: 40px; border-bottom: 1px solid #1E3A5F; padding-bottom: 20px; }
    h2 { font-family: 'Share Tech Mono', monospace; font-size: 32px; color: #8AF8FF; text-transform: uppercase; }
    
    .diagram-container { flex: 1; display: flex; align-items: center; justify-content: center; }
    .map-grid { display: grid; grid-template-columns: repeat(4, 240px); gap: 40px; align-items: center; justify-content: center; position: relative; }
    
    .node {
      border: 1px solid #1E3A5F;
      padding: 20px;
      text-align: center;
      position: relative;
      background: #0F171E;
    }
    .node::before {
      content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px;
      border-top: 2px solid #8AF8FF; border-left: 2px solid #8AF8FF;
    }
    .node-title { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #8AF8FF; margin-bottom: 8px; }
    .node-desc { font-size: 12px; color: #6B8A9C; }
    
    .connector { position: absolute; height: 2px; background: #1E3A5F; z-index: -1; }
    
    .page-num { position: absolute; bottom: 40px; right: 40px; font-family: 'Share Tech Mono', monospace; color: #6B8A9C; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">[ AEGIS v3.2 // SYS.OP.ACTIVE ]</div>
    <header>
      <h2>System Map</h2>
    </header>
    <div class="diagram-container">
      <div class="map-grid">
        <div class="node">
          <div class="node-title">BROWSER UI</div>
          <div class="node-desc">React 18 / Vite 5<br>Tailwind CSS 3</div>
        </div>
        <div class="node">
          <div class="node-title">SHELL LAYER</div>
          <div class="node-desc">BrowserRouter<br>HUD Navigation</div>
        </div>
        <div class="node">
          <div class="node-title">MAP CORE</div>
          <div class="node-desc">MapLibre GL<br>Globe Projection</div>
        </div>
        <div class="node">
          <div class="node-title">DATA SOURCE</div>
          <div class="node-desc">ADS-B / USGS<br>Public OSINT</div>
        </div>
      </div>
    </div>
    <div class="page-num">[ 02 / 07 ]</div>
  </div>
</body>
</html>
