<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #050A0E; color: #E2F1F8;
      font-family: 'Roboto Mono', monospace;
      display: flex; flex-direction: column;
      padding: 40px;
    }
    .motif { 
      position: absolute; top: 40px; right: 40px;
      color: #8AF8FF; font-family: 'Share Tech Mono', monospace;
      font-size: 14px; letter-spacing: 2px;
    }
    .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
    .wireframe-box {
      border: 1px solid #1E3A5F;
      padding: 60px;
      position: relative;
    }
    .wireframe-box::before, .wireframe-box::after {
      content: ''; position: absolute; width: 30px; height: 30px; border-color: #8AF8FF; border-style: solid;
    }
    .wireframe-box::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .wireframe-box::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    
    h1 { font-family: 'Share Tech Mono', monospace; font-size: 64px; color: #8AF8FF; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 20px; }
    .subtitle { font-size: 24px; color: #6B8A9C; letter-spacing: 2px; }
    
    .metadata {
      position: absolute; bottom: 0; left: 0;
      font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #6B8A9C;
      line-height: 1.6;
    }
    .cursor { display: inline-block; width: 10px; height: 18px; background: #8AF8FF; animation: blink 1s infinite; vertical-align: middle; margin-left: 5px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .page-num { position: absolute; bottom: 40px; right: 40px; font-family: 'Share Tech Mono', monospace; color: #6B8A9C; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">[ AEGIS v3.2 // SYS.OP.ACTIVE ]</div>
    <div class="main-content">
      <div class="wireframe-box">
        <h1>AEGIS-OS<br>Console Architecture</h1>
        <div class="subtitle">Technical Summary & System Observability Report</div>
      </div>
      <div class="metadata">
        > NODE_ID: 0x2785_LIVE<br>
        > SECURITY_LEVEL: UNCLASSIFIED // OSINT<br>
        > BUILD_VERSION: 6.2.0-STABLE<br>
        > SESSION_TIMESTAMP: 2026-11-01T14:50:56Z<span class="cursor"></span>
      </div>
    </div>
    <div class="page-num">[ 01 / 07 ]</div>
  </div>
</body>
</html>
