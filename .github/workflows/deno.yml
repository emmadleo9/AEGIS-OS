# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow is disabled for the AEGIS-OS monorepo.
# The repo contains Node/React/Python code, not Deno code.
# deno.json excludes all files from lint and test, so this CI
# job is kept only as a no-op placeholder and always succeeds.

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Verify Deno config excludes all files
        run: |
          deno lint --help >/dev/null 2>&1 || true
          echo "Deno lint/test skipped: AEGIS-OS is a non-Deno monorepo; deno.json excludes all files."
